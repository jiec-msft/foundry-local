name: Java SDK evaluation unit checks (preparation)

on:
  push:
    branches: [mason/java-asr-evaluation]
    paths:
      - sdk_v2/java/evaluation/**
      - .github/workflows/java-sdk*.yml
  pull_request:
    paths:
      - sdk_v2/java/evaluation/**
      - .github/workflows/java-sdk*.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-evaluation-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.repository == 'jiec-msft/foundry-local'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline scorer, fixture, architecture and preparation-gate tests
        run: python3 -m unittest discover -s sdk_v2/java/evaluation -p 'test_*.py' -v
      # No model, native build, decoder/archive download, cache or artifact upload.
